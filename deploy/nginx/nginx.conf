events {}
http {
  upstream caselab_api { server api:3000; }
  log_format main '$remote_addr - $request_id [$time_local] "$request" $status $body_bytes_sent';
  access_log /var/log/nginx/access.log main;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  server {
    listen 80; server_name _; client_max_body_size 1m;
    proxy_connect_timeout 5s; proxy_send_timeout 30s; proxy_read_timeout 30s;
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location = /metrics { proxy_pass http://caselab_api/metrics; proxy_set_header Host $host; }
    location / {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://caselab_api; proxy_http_version 1.1;
      proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-ID $request_id;
    }
  }
}