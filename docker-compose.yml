services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-caselab}
      POSTGRES_USER: ${DB_USER:-caselab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-caselab}
    ports:
      - "5432:5432"
    volumes:
      - caselab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER:-caselab} -d ${DB_NAME:-caselab}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  migrate:
    build: .
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-caselab}
      DB_USER: ${DB_USER:-caselab}
      DB_PASSWORD: ${DB_PASSWORD:-caselab}
      JWT_SECRET: ${JWT_SECRET:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node","scripts/init-db.cjs"]
    restart: "no"

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: http://localhost
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-caselab}
      DB_USER: ${DB_USER:-caselab}
      DB_PASSWORD: ${DB_PASSWORD:-caselab}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - caselab-prometheus-data:/prometheus
    expose:
      - "9090"

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - caselab-grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  caselab-postgres-data:
  caselab-prometheus-data:
  caselab-grafana-data:
